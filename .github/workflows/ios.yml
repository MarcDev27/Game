# Builds the iOS app (ios/), runs it in the iOS Simulator to check that the game loads, and, when
# started by hand with "upload" ticked, signs it and uploads it to App Store Connect (TestFlight).
#
# Upload setup (one time), in repository Settings → Secrets and variables → Actions:
#   APPLE_TEAM_ID              your 10-character Apple Developer Team ID
#   ASC_KEY_ID                 App Store Connect API key ID        (Users and Access → Integrations)
#   ASC_ISSUER_ID              App Store Connect API issuer ID
#   ASC_PRIVATE_KEY            contents of the AuthKey_XXXX.p8 file (key with the Admin role)
name: iOS app

on:
  push:
    branches: [main, claude/neon-strata-game]
    paths: ['ios/**', 'src/**', 'index.html', 'styles.css', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect (TestFlight)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"
          if [ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -n 1)" != "27.1" ]; then
            echo "::warning::iOS SDK $SDK is older than 27.1, so this build leaves out the iPhone Duo hinge code. App Store builds need Xcode 27.1 or later to fill the iPhone Duo display."
            echo "NO_DUO=1" >> "$GITHUB_ENV"
          fi

      - name: Build for the Simulator
        run: |
          EXTRA=()
          if [ "${NO_DUO:-}" = 1 ]; then EXTRA=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) NO_DUO_SDK'); fi
          mkdir -p sim
          if ! xcodebuild -project ios/Backup7105.xcodeproj -scheme Backup7105 -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO "${EXTRA[@]}" build > sim/xcodebuild.log 2>&1; then
            grep -E "error:" -A4 sim/xcodebuild.log | head -n 150 || true
            tail -n 40 sim/xcodebuild.log
            exit 1
          fi
          grep -E "warning:" sim/xcodebuild.log | grep -v "appintentsmetadataprocessor" | sort -u | head -n 60 || true
          tail -n 5 sim/xcodebuild.log
          APP=build/dd/Build/Products/Release-iphonesimulator/Backup7105.app
          test -f "$APP/web/index.html" && test -f "$APP/web/src/main.js"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Run in the Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = [d for k, v in json.load(sys.stdin)['devices'].items() if 'iOS' in k for d in v if d['name'].startswith('iPhone')]
          duo = [d for d in devs if 'Duo' in d['name']]
          print((duo or devs)[-1]['udid'])")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.marcdev27.backup7105
          sleep 30
          xcrun simctl io "$UDID" screenshot sim/title-screen.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "B7105"' | tee sim/log.txt
          grep -q "B7105 game ready" sim/log.txt
          if grep -q "B7105 JS" sim/log.txt; then echo "::error::The game reported script errors (see the log above)."; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-run
          path: sim
          if-no-files-found: ignore

  upload:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (27.1 or later)
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          xcodebuild -version
          if [ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -n 1)" != "27.1" ]; then
            echo "::error::iOS SDK $SDK found. Uploads need Xcode 27.1 or later so the app fills the iPhone Duo display."
            exit 1
          fi
      - name: Archive and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY" ]; then
            echo "::error::Add the APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY secrets first (see the top of this file)."
            exit 1
          fi
          KEYFILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$KEYFILE"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/Backup7105.xcodeproj -scheme Backup7105 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Backup7105.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Backup7105.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEYFILE"
